<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Cande Fit · Plan 8 semanas</title>
<meta name="theme-color" content="#d16ba5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cande Fit">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="app">
  <div class="topbar">Cande Fit</div>
  <div id="view"></div>
  <nav class="bottomnav">
    <button class="navbtn active" data-tab="hoy"><span class="icon">🏠</span>Hoy</button>
    <button class="navbtn" data-tab="entreno"><span class="icon">🏋️</span>Entreno</button>
    <button class="navbtn" data-tab="comidas"><span class="icon">🍽️</span>Comidas</button>
    <button class="navbtn" data-tab="progreso"><span class="icon">📈</span>Progreso</button>
    <button class="navbtn" data-tab="plan"><span class="icon">📋</span>Plan</button>
    <button class="navbtn" data-tab="ajustes"><span class="icon">⚙️</span>Ajustes</button>
  </nav>
</div>
<script src="js/data.js"></script>
<script src="js/storage.js"></script>
<script src="js/ai.js"></script>
<script src="js/app.js"></script>
<script>
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('service-worker.js').catch(() => {});
    });
  }
</script>
</body>
</html>
